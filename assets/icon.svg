<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Necro Slayers: a sword crossed behind a heater shield, in the game's
       earthy palette (forest green, parchment, brass and dark wood), with the
       menus' four-pointed star on the shield. -->
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef1f2"/><stop offset="0.5" stop-color="#c3c9cd"/><stop offset="1" stop-color="#8e979d"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3bf6a"/><stop offset="1" stop-color="#9b7133"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6f45"/><stop offset="1" stop-color="#26381f"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1dfb4"/><stop offset="1" stop-color="#c6a56a"/>
    </linearGradient>
  </defs>
  <!-- The sword, point up and to the right, behind the shield. -->
  <g transform="rotate(45 256 256)" stroke="#2b2030" stroke-width="8" stroke-linejoin="round">
    <path d="M226 470 L226 60 L256 6 L286 60 L286 470 Z" fill="url(#blade)"/>
    <path d="M256 30 L256 450" stroke="#7f878d" stroke-width="5"/>
    <rect x="166" y="404" width="180" height="30" rx="12" fill="url(#brass)"/>
    <rect x="238" y="434" width="36" height="58" rx="6" fill="#5a3b20"/>
    <circle cx="256" cy="500" r="18" fill="url(#brass)"/>
  </g>
  <!-- The shield: a parchment rim round a forest-green field, with brass trim. -->
  <g transform="translate(256 272) scale(0.8) translate(-256 -266)">
  <path d="M256 92 C320 118 370 122 404 118 C408 250 372 368 256 440 C140 368 104 250 108 118 C142 122 192 118 256 92 Z"
        fill="url(#rim)" stroke="#2b2030" stroke-width="10" stroke-linejoin="round"/>
  <path d="M256 124 C308 146 350 150 376 148 C376 254 346 348 256 406 C166 348 136 254 136 148 C162 150 204 146 256 124 Z"
        fill="url(#field)" stroke="#9b7133" stroke-width="7" stroke-linejoin="round"/>
  <!-- The star. -->
  <path d="M256 186 C264 236 276 248 322 258 C276 268 264 280 256 330 C248 280 236 268 190 258 C236 248 248 236 256 186 Z"
        fill="url(#brass)" stroke="#2b2030" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
